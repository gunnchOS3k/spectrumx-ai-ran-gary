# Paper II digital experiment protocol (FROZEN before held-out generation)
# Subject: Radio-Aware Digital-Twin-Informed Cross-Layer Orchestration for Service Continuity
# Evidence class: SYNTHETIC_SIM. Not measured RF. Not SpectrumX judged IQ.
# 28 GHz (ReadyGary sibling) is FR2 mmWave (3GPP TS 38.101-2), never Sub-6.
# Timing labels: HOST_PROCESS_TIMING ≠ gNB slot time, ONNX/TensorRT, or OTA.

paper: II
experiment_id: rq2_cross_layer_continuity
title: Radio-Aware Digital-Twin-Informed Cross-Layer Orchestration for Service Continuity
evidence_class: SYNTHETIC_SIM
latency_class: HOST_PROCESS_TIMING
frozen: true
frozen_date: "2026-08-18"
do_not_touch:
  - submissions/*/main.py
  - edge_ran_gary/submission_adapter
  - SpectrumX judged competition evaluate(filename) IQ core

carrier_note: >
  This repo's orchestration episodes are unitless synthetic radio/outage/compute
  draws. ReadyGary sibling TDL draws use carrier_freq_hz=28000000000 (FR2 mmWave).

hypotheses:
  H1: >
    On held-out in-distribution synthetic episodes, twin_informed mean
    service_continuity_utility exceeds no_adaptation.
  H2: >
    twin_informed and information_equivalent receive the same slot feature
    vector; a difference in held-out continuity (if present) is a policy-structure
    effect, not an information-access effect.
  H3: >
    Accounting for switching cost reduces net utility versus the same policy
    with switch penalties zeroed (ablation no_switch_cost).
  H0_to_reject: Twin fields are irrelevant once a static first-slot rule exists.

split:
  train_family: in_distribution
  held_out_family: held_out
  domain_shift_families:
    - high_blockage
    - energy_constrained
    - outage_heavy
  train_seeds: [0, 1, 2, 3, 4]
  held_out_seeds: [100, 101, 102, 103, 104]
  n_episodes_per_seed: 24
  n_slots_per_episode: 16

policies:
  - no_adaptation
  - static
  - local_only
  - cloud_only
  - edge_only
  - rule_based
  - optimization_based
  - twin_informed
  - information_equivalent
  - oracle
  - fixed_target_fidelity
  - adaptive_fidelity
  - checkpoint_disabled
  - adaptive_checkpoint

policy_definitions:
  no_adaptation: Always cloud + terrestrial (or first listed network); equal shares; never switches.
  static: rule_based on slot 0, then freeze action for the episode.
  local_only: Always local placement; degraded_local or first non-terrestrial network.
  cloud_only: Always cloud placement; terrestrial if available else ntn_fallback.
  edge_only: Always edge placement; local_edge_wifi if available else degraded_local.
  rule_based: Deterministic service-priority shares + outage-aware network pick (existing Gate 2 service_priority logic, synthetic context).
  optimization_based: SLSQP on sum(log(1+share)) under spectrum budget if scipy is present; else static_uniform fallback recorded as such.
  twin_informed: Joint use of outage, energy, continuity class, latency, and compute nodes plus constrained shares.
  information_equivalent: Same feature vector as twin_informed; different policy (frozen linear action scores, uniform shares).
  oracle: Model-oracle over discrete placement x network x fidelity on the current slot under the same analytical metric including switch penalties. Not a future-peek. Not measured RF.
  fixed_target_fidelity: Baseline holding fidelity_level=target with checkpoint/recover disabled.
  adaptive_fidelity: Chooses fidelity_level in {target, degraded, minimum_useful} from current-slot energy/latency/outage thresholds only.
  checkpoint_disabled: Baseline with checkpoint_action/recover_action always none.
  adaptive_checkpoint: Cross-layer checkpoint/recover from current-slot checkpoint availability/age/progress/budget; thrash prevention; safe degraded/offline continuation on failed recover.

fidelity_levels:
  - target
  - degraded
  - minimum_useful

fidelity_service_profile: >
  Continuity factors target=1.0, degraded=0.85, minimum_useful=0.65;
  energy factors target=1.15, degraded=1.0, minimum_useful=0.75;
  fidelity switch penalty=0.04. Utility reflects fidelity only via these documented thresholds/costs.

checkpoint_recovery:
  checkpoint_action_penalty: 0.03
  recover_action_penalty: 0.06
  stale_checkpoint_age_slots: 8
  thrash_window: 2
  thrash_penalty: 0.08
  network_change_recover_extra: 0.03
  initial_checkpoint:
    exists: false
    age_slots: 0
    progress: 0.0
  note: >
    Application persistence is NOT claimed; this is synthetic cross-layer modeling
    of continuity only. Checkpoint state is causally updated across slots (not
    independently resampled). ReadyGary beam export not required.

synthetic_parameters:
  version: "rq2-fidelity-synth-v1"
  fidelity_continuity_factor:
    target:
      value: 1.0
      unit: dimensionless_multiplier
      interpretation: Continuity utility scale at target fidelity
      provenance: SYNTHETIC_ASSUMPTION
      default: 1.0
      sensitivity_range: [0.95, 1.0]
    degraded:
      value: 0.85
      unit: dimensionless_multiplier
      interpretation: Continuity utility scale at degraded fidelity
      provenance: SYNTHETIC_ASSUMPTION
      default: 0.85
      sensitivity_range: [0.75, 0.90]
    minimum_useful:
      value: 0.65
      unit: dimensionless_multiplier
      interpretation: Continuity utility scale at minimum-useful fidelity
      provenance: SYNTHETIC_ASSUMPTION
      default: 0.65
      sensitivity_range: [0.55, 0.75]
  fidelity_energy_factor:
    target:
      value: 1.15
      unit: dimensionless_multiplier
      interpretation: Energy use scale at target fidelity
      provenance: SYNTHETIC_ASSUMPTION
      default: 1.15
      sensitivity_range: [1.05, 1.25]
    degraded:
      value: 1.0
      unit: dimensionless_multiplier
      interpretation: Energy use scale at degraded fidelity
      provenance: SYNTHETIC_ASSUMPTION
      default: 1.0
      sensitivity_range: [0.9, 1.1]
    minimum_useful:
      value: 0.75
      unit: dimensionless_multiplier
      interpretation: Energy use scale at minimum-useful fidelity
      provenance: SYNTHETIC_ASSUMPTION
      default: 0.75
      sensitivity_range: [0.65, 0.85]
  fidelity_switch_penalty:
    value: 0.04
    unit: utility_penalty_per_switch
    interpretation: Continuity utility cost when fidelity_level changes
    provenance: SYNTHETIC_ASSUMPTION
    default: 0.04
    sensitivity_range: [0.02, 0.08]
  network_change_recover_extra:
    value: 0.03
    unit: utility_penalty
    interpretation: Extra recover cost when network changes during recover
    provenance: SYNTHETIC_ASSUMPTION
    default: 0.03
    sensitivity_range: [0.01, 0.06]
  successful_recover_continuity_boost:
    value: 0.08
    unit: continuity_utility_increment
    interpretation: Continuity boost on successful recover, scaled by task_progress
    provenance: SYNTHETIC_ASSUMPTION
    default: 0.08
    sensitivity_range: [0.04, 0.12]
  sensitivity_predeclared:
    parameter: fidelity_continuity_factor.degraded
    values: [0.75, 0.85, 0.90]
    seeds: [0]
    n_episodes_per_seed: 1
    n_slots_per_episode: 4
    policies: [fixed_target_fidelity, adaptive_fidelity]
    note: Predeclared before outcome inspection; not tuned post-hoc.

ablations:
  - full
  - no_edge_observations
  - no_twin_context
  - no_continuity_objective
  - no_energy_constraint
  - no_local_edge
  - no_switch_cost

metrics:
  primary: service_continuity_utility
  secondary:
    - predicted_latency_ms
    - energy_use_j
    - fairness
    - n_network_switches
    - n_placement_switches
    - switch_cost
    - compute_time_ms

costs:
  network_switch_penalty: 0.05
  placement_switch_penalty: 0.03
  fidelity_switch_penalty: 0.04
  checkpoint_action_penalty: 0.03
  recover_action_penalty: 0.06
  compute_time_is: HOST_PROCESS_TIMING

information_equivalent_weights:
  latency: 0.004
  loss: 0.02
  outage_mismatch: 0.35
  energy: 0.002
  continuity_match: 0.25
  edge_bonus_if_high_latency: 0.15

statistics:
  ci_level: 0.95
  ci_method: student_t_over_seed_means
  t_crit_verification_source: >
    SciPy 1.18.0 scipy.stats.t.ppf(0.975, df) preferred; stdlib table fallback
    without silent 1.96 substitution for finite missing df.
  effect_size: cohens_d_vs_no_adaptation
  aggregation: mean_over_slots_then_episodes_then_seeds
  frozen_split_n:
    train_seeds: 5
    held_out_seeds: 5
    note: Paper-II frozen split/seed protocol preserved; n reported separately.

metric_model: >
  Analytical configured model from Gate 2 twin_policies._predict_metrics:
  predicted_latency = measured_latency * network_penalty * placement_penalty * (1 + 0.4*util).
  Not a field-validated predictor. Not competition IQ.

held_out_rule: >
  Held-out JSON must not be generated until this protocol file exists in the
  working tree (and should be committed first). Train-family sweeps may run
  after protocol exists; held-out seeds 100-104 are the confirmatory split.
